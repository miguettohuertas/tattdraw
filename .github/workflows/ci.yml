# Integração contínua: a cada push e pull request, o GitHub roda as mesmas verificações
# que você roda localmente com "npm run check" e confirma que o build funciona.
# Em repositório público, o GitHub Actions é gratuito; em privado há uma cota mensal gratuita.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # o CI não precisa dos modelos 3D; economiza a cota do Git LFS

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
