<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1d22" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>TattDraw</title>
  </head>
  <body>
    <canvas id="viewport" aria-label="Modelo 3D: desenhe com a caneta ou o mouse"></canvas>

    <!-- Os ícones (data-icon) são desenhados por src/icons.ts. -->
    <div class="topbar">
      <div class="group" role="toolbar" aria-label="Pincel">
        <button
          id="tool-pen"
          class="icon"
          data-icon="pen"
          type="button"
          aria-pressed="true"
          aria-label="Pincel"
          title="Pincel (B)"
        ></button>
        <button
          id="tool-eraser"
          class="icon"
          data-icon="eraser"
          type="button"
          aria-pressed="false"
          aria-label="Borracha"
          title="Borracha (E)"
        ></button>

        <!-- Os botões das cores da paleta são criados em brush-controls.ts. -->
        <div id="swatches" class="swatches" role="group" aria-label="Cor">
          <label class="swatch custom" title="Outra cor">
            <input id="custom-color" type="color" value="#7a3fb0" aria-label="Outra cor" />
          </label>
        </div>

        <label class="slider" title="Tamanho ([ e ])">
          <span id="size-label">5 mm</span>
          <input id="size" type="range" min="0.5" max="30" step="0.5" value="5" />
        </label>
      </div>

      <div class="group" role="toolbar" aria-label="Histórico e camadas">
        <button
          id="undo"
          class="icon"
          data-icon="undo"
          type="button"
          disabled
          aria-label="Desfazer"
          title="Desfazer (Ctrl+Z)"
        ></button>
        <button
          id="redo"
          class="icon"
          data-icon="redo"
          type="button"
          disabled
          aria-label="Refazer"
          title="Refazer (Ctrl+Y)"
        ></button>
        <button
          id="layers-toggle"
          class="icon"
          data-icon="layers"
          type="button"
          aria-expanded="false"
          aria-pressed="false"
          aria-controls="layers-panel"
          aria-label="Camadas"
          title="Camadas"
        ></button>
      </div>

      <!-- Painel de camadas: a lista é preenchida por src/layers-panel.ts. -->
      <section id="layers-panel" class="panel" aria-label="Camadas" hidden>
        <ul id="layer-list"></ul>

        <label class="slider" title="Opacidade da camada escolhida">
          <span>Opacidade</span>
          <input id="layer-opacity" type="range" min="0" max="100" step="5" value="100" />
          <output id="opacity-label" for="layer-opacity">100%</output>
        </label>

        <div class="panel-actions">
          <button
            id="layer-add"
            class="icon"
            data-icon="plus"
            type="button"
            aria-label="Nova camada"
            title="Nova camada"
          ></button>
          <button
            id="layer-up"
            class="icon"
            data-icon="up"
            type="button"
            aria-label="Subir camada"
            title="Subir camada"
          ></button>
          <button
            id="layer-down"
            class="icon"
            data-icon="down"
            type="button"
            aria-label="Descer camada"
            title="Descer camada"
          ></button>
          <button id="clear" type="button" title="Apagar tudo desta camada">Limpar</button>
          <button
            id="layer-remove"
            class="icon"
            data-icon="trash"
            type="button"
            aria-label="Excluir camada"
            title="Excluir camada"
          ></button>
        </div>
      </section>
    </div>

    <div id="toast" role="status" hidden></div>
    <div id="hud" aria-live="off"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
