<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1d22" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>TattDraw</title>
  </head>
  <body>
    <canvas id="viewport" aria-label="Modelo 3D: desenhe com a caneta ou o mouse"></canvas>

    <div class="topbar">
      <div class="group" role="toolbar" aria-label="Pincel">
        <button id="tool-pen" type="button" aria-pressed="true" title="Pincel (B)">Pincel</button>
        <button id="tool-eraser" type="button" aria-pressed="false" title="Borracha (E)">
          Borracha
        </button>

        <!-- Os botões das cores da paleta são criados em brush-controls.ts. -->
        <div id="swatches" class="swatches" role="group" aria-label="Cor">
          <label class="swatch custom" title="Outra cor">
            <input id="custom-color" type="color" value="#7a3fb0" aria-label="Outra cor" />
          </label>
        </div>

        <label class="size" title="Tamanho ([ e ])">
          <span id="size-label">5 mm</span>
          <input id="size" type="range" min="0.5" max="30" step="0.5" value="5" />
        </label>
      </div>

      <div class="group" role="toolbar" aria-label="Histórico">
        <!-- Ícones no lugar do texto para a barra caber numa linha só no celular deitado. -->
        <button
          id="undo"
          class="icon"
          type="button"
          disabled
          title="Desfazer (Ctrl+Z)"
          aria-label="Desfazer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
        </button>
        <button
          id="redo"
          class="icon"
          type="button"
          disabled
          title="Refazer (Ctrl+Y)"
          aria-label="Refazer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
        </button>
        <button id="clear" type="button">Limpar</button>
      </div>
    </div>

    <div id="hud" aria-live="off"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
