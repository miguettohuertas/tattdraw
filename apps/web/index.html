<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1d22" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>TattDraw</title>
  </head>
  <body>
    <canvas id="viewport" aria-label="Modelo 3D: desenhe com a caneta ou o mouse"></canvas>
    <div class="toolbar">
      <button id="undo" type="button" disabled title="Desfazer (Ctrl+Z)">Desfazer</button>
      <button id="redo" type="button" disabled title="Refazer (Ctrl+Y)">Refazer</button>
      <button id="clear" type="button">Limpar</button>
    </div>
    <div id="hud" aria-live="off"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
